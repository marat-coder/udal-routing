name: Geo autoupdate

on:
  workflow_dispatch:
    inputs:
      baseline_reproduction:
        description: Reproduce immutable baseline 2026.09.25.3
        required: true
        type: boolean
        default: true
      dry_run:
        description: Build and validate only; never create a release
        required: true
        type: boolean
        default: true
      manifest_v2_determinism_test:
        description: Run isolated frozen-plan MANIFEST v2 determinism proof only
        required: true
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/update-geo.yml'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
  schedule:
    # Feature-branch preparation only; active scheduling requires merge to default branch.
    - cron: '17 */6 * * *'

concurrency:
  group: geo-autoupdate
  cancel-in-progress: false

jobs:
  mode:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      run_mode: ${{ steps.normalize.outputs.run_mode }}
      baseline_reproduction: ${{ steps.normalize.outputs.baseline_reproduction }}
      dry_run: ${{ steps.normalize.outputs.dry_run }}
      manifest_test: ${{ steps.normalize.outputs.manifest_test }}
      auto_publish: ${{ steps.normalize.outputs.auto_publish }}
      run_build: ${{ steps.normalize.outputs.run_build }}
    steps:
      - id: normalize
        shell: bash
        env:
          INPUT_BASELINE: ${{ inputs.baseline_reproduction }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_MANIFEST_TEST: ${{ inputs.manifest_v2_determinism_test }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              MODE=ci; BASE=false; DRY=true; MTEST=false; AUTO=false; BUILD=false ;;
            schedule)
              MODE=scheduled; BASE=false; DRY=false; MTEST=false; AUTO=true; BUILD=true ;;
            workflow_dispatch)
              BASE="${INPUT_BASELINE:-false}"
              DRY="${INPUT_DRY_RUN:-true}"
              MTEST="${INPUT_MANIFEST_TEST:-false}"
              AUTO=false
              if [[ "$MTEST" == "true" ]]; then MODE=manifest-test; BUILD=false
              elif [[ "$BASE" == "true" ]]; then MODE=baseline; BUILD=true
              else MODE=manual; BUILD=true
              fi ;;
            *)
              echo "FAIL: unsupported event $GITHUB_EVENT_NAME" >&2; exit 1 ;;
          esac
          {
            echo "run_mode=$MODE"
            echo "baseline_reproduction=$BASE"
            echo "dry_run=$DRY"
            echo "manifest_test=$MTEST"
            echo "auto_publish=$AUTO"
            echo "run_build=$BUILD"
          } >> "$GITHUB_OUTPUT"
          echo "RUN_MODE=$MODE"

  phase-b-tests:
    needs: mode
    if: ${{ needs.mode.outputs.run_mode == 'ci' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run Phase B tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts tests
          bash -n scripts/build-geosite.sh scripts/build-geoip.sh scripts/validate-geodata.sh scripts/publish-validated-draft.sh
          python3 -m unittest discover -s tests -v

  manifest-v2-determinism:
    needs: mode
    if: ${{ needs.mode.outputs.manifest_test == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TEST_ROOT: work/manifest-v2-determinism

    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v4

      - name: Verify determinism-test safety gates
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          policy_path = Path("config/routing-policy.json")
          policy_sha = hashlib.sha256(policy_path.read_bytes()).hexdigest()
          expected_policy_sha = "8654b9f9b941e0e43c384eee5adb152d113916286cc75abc5faa8a17a0133942"
          if policy_sha != expected_policy_sha:
              raise SystemExit(f"FAIL: routing policy changed: {policy_sha}")

          policy = json.loads(policy_path.read_text())
          if policy["proxyIp"] != ["geoip:telegram", "geoip:facebook"]:
              raise SystemExit("FAIL: ProxyIp contract changed")
          if "geoip:ru-blocked" in policy["proxyIp"]:
              raise SystemExit("FAIL: broad geoip:ru-blocked active")

          manifest_cfg = json.loads(Path("config/manifest-schema-v2.json").read_text())
          if manifest_cfg["productionManifestSchema"] != 2:
              raise SystemExit("FAIL: MANIFEST v2 config changed")

          print("TEST_MODE=MANIFEST_V2_DETERMINISM")
          print("FROZEN_BUILD_PLAN=YES")
          print("CURRENT_UPSTREAM_PATH=BLOCKED")
          print("NO_CHANGES_DEPENDENCY=NO")
          print("RELEASE_CREATION_PATH=BLOCKED")
          print("TAG_CREATION_PATH=BLOCKED")
          print("SCHEDULE=OFF")
          print("AUTO_PUBLISH=NO")
          PY

      - name: Run frozen MANIFEST v2 determinism proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$TEST_ROOT"
          mkdir -p "$TEST_ROOT/a" "$TEST_ROOT/b"

          cat > "$TEST_ROOT/frozen-provenance.json" <<'JSON'
          {
            "domainListCommunity": {
              "repository": "v2fly/domain-list-community",
              "commit": "a5731758ed6bc9620b0e146ed24b07b9131893cf",
              "timestamp": "2026-09-25T00:00:00Z",
              "relevantHash": "c826e971a42c88920069cb6d7c14b3e7fb5da018db88f0cccc9d30485e07d34b"
            },
            "ruBlockedGeosite": {
              "repository": "runetfreedom/russia-blocked-geosite",
              "release": "202608101553",
              "asset": "ru-blocked.txt",
              "size": 1731646,
              "sha256": "8b8d8d1ce37edbdc550bbb73f473f072b15432bf42b1fac5b35f95a603fec77d",
              "publishedAt": "2026-08-10T15:53:00Z"
            },
            "geoip": {
              "repository": "runetfreedom/russia-blocked-geoip",
              "release": "202609250840",
              "asset": "geoip.dat",
              "size": 18083158,
              "sha256": "0918202112fa7cd038dc81254f8ae637f8aaf9b02311898ccd22ba079592cbac",
              "publishedAt": "2026-09-25T08:42:07Z",
              "model": "FULL_PINNED_RUNETFREEDOM_BYTE_FOR_BYTE"
            },
            "routingPolicySha256": "8654b9f9b941e0e43c384eee5adb152d113916286cc75abc5faa8a17a0133942",
            "inputFingerprint": "84fc3cf8124fcbdc1a6c753ce4825211bf4b7c45e940265ce2b7d94f29c49c9f"
          }
          JSON

          cat > "$TEST_ROOT/runtime-a.json" <<'JSON'
          {
            "workflowRunId": "111111",
            "workflowRunURL": "https://example.invalid/runtime-a",
            "workflowTrigger": "workflow_dispatch",
            "repositoryCommitSHA": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
            "actor": "runtime-a",
            "runTimestamp": "2001-01-01T00:00:00Z"
          }
          JSON

          cat > "$TEST_ROOT/runtime-b.json" <<'JSON'
          {
            "workflowRunId": "999999",
            "workflowRunURL": "https://example.invalid/runtime-b",
            "workflowTrigger": "schedule",
            "repositoryCommitSHA": "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb",
            "actor": "runtime-b",
            "runTimestamp": "2099-12-31T23:59:59Z"
          }
          JSON

          if cmp -s "$TEST_ROOT/runtime-a.json" "$TEST_ROOT/runtime-b.json"; then
            echo "FAIL: runtime contexts unexpectedly identical" >&2
            exit 1
          fi
          echo "RUNTIME_CONTEXT_A_B_DIFFERENT=PASS"

          for d in a b; do
            printf '%s\n' 'synthetic-geosite-fixture-v1' > "$TEST_ROOT/$d/UDAL-GEOSITE.dat"
            printf '%s\n' 'synthetic-geoip-fixture-v1' > "$TEST_ROOT/$d/UDAL-GEOIP.dat"
            printf '%s\n' 'synthetic-routing-fixture-v1' > "$TEST_ROOT/$d/UDAL-ROUTING.json"
            printf '%s\n' 'synthetic-routing-live-fixture-v1' > "$TEST_ROOT/$d/UDAL-ROUTING-LIVE.json"
          done

          COMMON_ARGS=(
            --manifest-config config/manifest-schema-v2.json
            --build-contract config/build-contract.json
            --toolchain-lock config/toolchain-lock.json
            --validation-contract config/validation-contract.json
            --policy config/routing-policy.json
            --provenance "$TEST_ROOT/frozen-provenance.json"
            --tag 2099.01.01.999
            --previous-production 2026.09.25.3
            --last-updated 1790327433
            --input-fingerprint 84fc3cf8124fcbdc1a6c753ce4825211bf4b7c45e940265ce2b7d94f29c49c9f
          )

          GITHUB_RUN_ID=111111 \
          GITHUB_EVENT_NAME=workflow_dispatch \
          GITHUB_ACTOR=runtime-a \
          GITHUB_SHA=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
          python3 scripts/make-manifest.py \
            "${COMMON_ARGS[@]}" \
            --bundle "$TEST_ROOT/a" \
            --output "$TEST_ROOT/a/MANIFEST.json"

          python3 scripts/make-sha256sums.py --bundle "$TEST_ROOT/a" --build-contract config/build-contract.json

          GITHUB_RUN_ID=999999 \
          GITHUB_EVENT_NAME=schedule \
          GITHUB_ACTOR=runtime-b \
          GITHUB_SHA=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
          python3 scripts/make-manifest.py \
            "${COMMON_ARGS[@]}" \
            --bundle "$TEST_ROOT/b" \
            --output "$TEST_ROOT/b/MANIFEST.json"

          python3 scripts/make-sha256sums.py --bundle "$TEST_ROOT/b" --build-contract config/build-contract.json

          MANIFEST_A_SHA="$(sha256sum "$TEST_ROOT/a/MANIFEST.json" | awk '{print $1}')"
          MANIFEST_B_SHA="$(sha256sum "$TEST_ROOT/b/MANIFEST.json" | awk '{print $1}')"
          SUMS_A_SHA="$(sha256sum "$TEST_ROOT/a/SHA256SUMS" | awk '{print $1}')"
          SUMS_B_SHA="$(sha256sum "$TEST_ROOT/b/SHA256SUMS" | awk '{print $1}')"

          echo "MANIFEST_V2_RUN_A_SHA256=$MANIFEST_A_SHA"
          echo "MANIFEST_V2_RUN_B_SHA256=$MANIFEST_B_SHA"
          echo "MANIFEST_WITH_RUNTIME_A_SHA256=$MANIFEST_A_SHA"
          echo "MANIFEST_WITH_RUNTIME_B_SHA256=$MANIFEST_B_SHA"
          echo "SHA256SUMS_A=$SUMS_A_SHA"
          echo "SHA256SUMS_B=$SUMS_B_SHA"
          echo "SHA256SUMS_WITH_RUNTIME_A=$SUMS_A_SHA"
          echo "SHA256SUMS_WITH_RUNTIME_B=$SUMS_B_SHA"

          test "$MANIFEST_A_SHA" = "$MANIFEST_B_SHA"
          test "$SUMS_A_SHA" = "$SUMS_B_SHA"
          cmp "$TEST_ROOT/a/MANIFEST.json" "$TEST_ROOT/b/MANIFEST.json"
          cmp "$TEST_ROOT/a/SHA256SUMS" "$TEST_ROOT/b/SHA256SUMS"

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("work/manifest-v2-determinism")
          cfg = json.loads(Path("config/manifest-schema-v2.json").read_text())
          forbidden = set(cfg["forbiddenRuntimeFields"])

          a = json.loads((root / "a/MANIFEST.json").read_text())
          b = json.loads((root / "b/MANIFEST.json").read_text())

          def walk(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key in forbidden:
                          raise SystemExit(f"FAIL: runtime field leaked into MANIFEST v2: {key}")
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)

          walk(a)
          walk(b)

          if a.get("manifestSchema") != 2 or b.get("manifestSchema") != 2:
              raise SystemExit("FAIL: manifest schema is not v2")
          if a["buildPlan"]["previousProductionRelease"] != "2026.09.25.3":
              raise SystemExit("FAIL: previousProductionRelease frozen input mismatch")

          print("MANIFEST_SCHEMA=2")
          print("PREVIOUS_PRODUCTION_MODEL=FROZEN_INPUT")
          print("MANIFEST_RUNTIME_FIELDS_ABSENT=PASS")
          PY

          echo "MANIFEST_V2_DETERMINISM=PASS"
          echo "SHA256SUMS_DETERMINISM=PASS"
          echo "RUNTIME_METADATA_HASH_INFLUENCE=NONE"

          {
            echo "### MANIFEST v2 determinism proof"
            echo ""
            echo "- Test mode: isolated frozen synthetic/build plan"
            echo "- Current upstream used: NO"
            echo "- NO_CHANGES dependency: NO"
            echo "- Runtime context A: $TEST_ROOT/runtime-a.json"
            echo "- Runtime context B: $TEST_ROOT/runtime-b.json"
            echo "- Runtime provenance location: Job Summary / future draft release body only"
            echo "- MANIFEST v2 SHA256: $MANIFEST_A_SHA"
            echo "- SHA256SUMS SHA256: $SUMS_A_SHA"
            echo "- RUNTIME_METADATA_HASH_INFLUENCE=NONE"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "RUNTIME_PROVENANCE_LOCATION=JOB_SUMMARY_AND_FUTURE_DRAFT_RELEASE_BODY"
          echo "RESULT=PASS"

  build:
    needs: mode
    if: ${{ needs.mode.outputs.run_build == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      no_changes: ${{ steps.meta.outputs.no_changes }}
      tag: ${{ steps.meta.outputs.tag }}
      input_fingerprint: ${{ steps.meta.outputs.input_fingerprint }}
      previous_production: ${{ steps.meta.outputs.previous_production }}
      last_updated: ${{ steps.meta.outputs.last_updated }}
      stale_draft: ${{ steps.meta.outputs.stale_draft }}
      schedule_eligible: ${{ steps.meta.outputs.schedule_eligible }}
      change_reasons: ${{ steps.meta.outputs.change_reasons }}
    env:
      BASELINE_FILE: config/baseline-2026.09.25.3.json
      POLICY_FILE: config/routing-policy.json
      BASELINE_POLICY_FILE: config/baseline-routing-policy-2026.09.25.3.json
      MANIFEST_CONFIG: config/manifest-schema-v2.json
      BUILD_CONTRACT: config/build-contract.json

    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pinned Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: false

      - name: Verify repository configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(go version | awk '{print $3}')" = "go1.25.12"
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path("config/routing-policy.json").read_text())
          bp = json.loads(Path("config/baseline-routing-policy-2026.09.25.3.json").read_text())
          b = json.loads(Path("config/baseline-2026.09.25.3.json").read_text())
          mc = json.loads(Path("config/manifest-schema-v2.json").read_text())

          assert len(p["geositeTopLevel"]) == 31
          assert len(p["proxySites"]) == 22
          assert len(p["geositeReserve"]) == 9
          assert p["proxyIp"] == ["geoip:telegram", "geoip:facebook"]
          assert "geoip:ru-blocked" not in p["proxyIp"]
          assert "geosite:meta" not in p["proxySites"]
          assert "meta" not in p["geositeTopLevel"]

          assert bp["proxyIp"] == ["geoip:telegram", "geoip:facebook"]
          assert bp == p

          assert b["baselineRelease"] == "2026.09.25.3"
          assert b["contracts"]["proxyIp"] == ["geoip:telegram", "geoip:facebook"]
          assert b["contracts"]["broadRuBlockedGeoipActive"] is False
          assert mc["productionManifestSchema"] == 2
          assert mc["appliesAfterRelease"] == "2026.09.25.3"
          assert mc["legacyManifest"] == {
              "release": "2026.09.25.3",
              "schema": 1,
              "status": "KNOWN_RUNTIME_METADATA_NONDETERMINISM",
          }
          print("ROUTING_POLICY_BASELINE_LOCK=PASS")
          print("MANIFEST_ARCHITECTURE_V2=PASS")
          print("REPOSITORY_CONFIG=PASS")
          PY

      - name: Download and verify immutable baseline templates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/baseline-release
          BASELINE_TAG="$(python3 -c 'import json; print(json.load(open("config/baseline-2026.09.25.3.json"))["baselineRelease"])')"
          gh release download "$BASELINE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "UDAL-ROUTING.json" \
            --dir work/baseline-release

          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          b = json.loads(Path("config/baseline-2026.09.25.3.json").read_text())
          root = Path("work/baseline-release")
          name = "UDAL-ROUTING.json"
          data = (root / name).read_bytes()
          got = hashlib.sha256(data).hexdigest()
          want = b["artifacts"][name]["sha256"]
          if got != want:
              raise SystemExit(f"FAIL: baseline routing template hash mismatch: {name}")
          print("BASELINE_ROUTING_TEMPLATE=PASS")
          PY

      - name: Discover and prepare baseline inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/inputs
          python3 scripts/discover-inputs.py \
            --mode baseline \
            --baseline "$BASELINE_FILE" \
            --output work/provenance-baseline-discovered.json

          RU_ID="$(python3 -c 'import json; print(json.load(open("work/provenance-baseline-discovered.json"))["ruBlockedGeosite"]["assetId"])')"
          IP_ID="$(python3 -c 'import json; print(json.load(open("work/provenance-baseline-discovered.json"))["geoip"]["assetId"])')"

          gh api "repos/runetfreedom/russia-blocked-geosite/releases/assets/$RU_ID" \
            -H "Accept: application/octet-stream" > work/inputs/baseline-ru-blocked.txt
          gh api "repos/runetfreedom/russia-blocked-geoip/releases/assets/$IP_ID" \
            -H "Accept: application/octet-stream" > work/inputs/baseline-geoip.dat

          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = json.loads(Path("work/provenance-baseline-discovered.json").read_text())
          for path, section in [
              (Path("work/inputs/baseline-ru-blocked.txt"), "ruBlockedGeosite"),
              (Path("work/inputs/baseline-geoip.dat"), "geoip"),
          ]:
              got = hashlib.sha256(path.read_bytes()).hexdigest()
              if got != p[section]["sha256"]:
                  raise SystemExit(f"FAIL: downloaded baseline source hash mismatch: {section}")
          print("BASELINE_SOURCE_DOWNLOAD=PASS")
          PY

          DLC_SHA="$(python3 -c 'import json; print(json.load(open("work/provenance-baseline-discovered.json"))["domainListCommunity"]["commit"])')"
          git init -q work/dlc-baseline
          git -C work/dlc-baseline remote add origin https://github.com/v2fly/domain-list-community.git
          git -C work/dlc-baseline fetch -q --depth=1 origin "$DLC_SHA"
          git -C work/dlc-baseline checkout -q --detach FETCH_HEAD

          python3 scripts/prepare-geosite.py \
            --policy "$BASELINE_POLICY_FILE" \
            --dlc-data work/dlc-baseline/data \
            --ru-blocked work/inputs/baseline-ru-blocked.txt \
            --output-data work/data-baseline \
            --datprofile work/datprofile-baseline.json

          SOURCE_COUNT="$(find work/data-baseline -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$SOURCE_COUNT" = "42"

          HASH_OUT="$(python3 scripts/hash-source-tree.py --dir work/data-baseline --exclude ru-blocked)"
          printf '%s\n' "$HASH_OUT"
          RELEVANT_HASH="$(printf '%s\n' "$HASH_OUT" | sed -n 's/^RELEVANT_HASH=//p')"
          POLICY_SHA="$(python3 -c 'import json; print(json.load(open("config/baseline-2026.09.25.3.json"))["routingPolicySha256"])')"

          python3 scripts/make-fingerprint.py \
            --provenance work/provenance-baseline-discovered.json \
            --relevant-hash "$RELEVANT_HASH" \
            --policy-sha "$POLICY_SHA" \
            --fingerprint-schema legacy-v1 \
            --output work/provenance-baseline.json

      - name: Prepare baseline reproduction mode
        if: ${{ needs.mode.outputs.baseline_reproduction == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cp work/provenance-baseline.json work/candidate-provenance.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          b = json.loads(Path("config/baseline-2026.09.25.3.json").read_text())
          p = json.loads(Path("work/candidate-provenance.json").read_text())
          meta = {
              "mode": "baseline",
              "noChanges": False,
              "tag": b["baselineRelease"],
              "lastUpdated": b["routingLastUpdated"],
              "previousProduction": b["baselineRelease"],
              "inputFingerprint": p["inputFingerprint"],
          }
          Path("work/candidate-meta.json").write_text(json.dumps(meta, indent=2) + "\n")
          PY

          ln -s "$PWD/work/dlc-baseline" work/dlc-candidate
          ln -s "$PWD/work/data-baseline" work/data-candidate
          ln -s "$PWD/work/datprofile-baseline.json" work/datprofile-candidate.json
          ln -s "$PWD/work/inputs/baseline-geoip.dat" work/geoip-candidate.dat

      - name: Discover and prepare current upstream
        if: ${{ needs.mode.outputs.baseline_reproduction != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/discover-inputs.py \
            --mode current \
            --baseline "$BASELINE_FILE" \
            --output work/provenance-current-discovered.json

          RU_ID="$(python3 -c 'import json; print(json.load(open("work/provenance-current-discovered.json"))["ruBlockedGeosite"]["assetId"])')"
          IP_ID="$(python3 -c 'import json; print(json.load(open("work/provenance-current-discovered.json"))["geoip"]["assetId"])')"

          gh api "repos/runetfreedom/russia-blocked-geosite/releases/assets/$RU_ID" \
            -H "Accept: application/octet-stream" > work/inputs/current-ru-blocked.txt
          gh api "repos/runetfreedom/russia-blocked-geoip/releases/assets/$IP_ID" \
            -H "Accept: application/octet-stream" > work/inputs/current-geoip.dat

          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = json.loads(Path("work/provenance-current-discovered.json").read_text())
          for path, section in [
              (Path("work/inputs/current-ru-blocked.txt"), "ruBlockedGeosite"),
              (Path("work/inputs/current-geoip.dat"), "geoip"),
          ]:
              got = hashlib.sha256(path.read_bytes()).hexdigest()
              if got != p[section]["sha256"]:
                  raise SystemExit(f"FAIL: current source hash mismatch: {section}")
          print("CURRENT_SOURCE_DOWNLOAD=PASS")
          PY

          DLC_SHA="$(python3 -c 'import json; print(json.load(open("work/provenance-current-discovered.json"))["domainListCommunity"]["commit"])')"
          git init -q work/dlc-current
          git -C work/dlc-current remote add origin https://github.com/v2fly/domain-list-community.git
          git -C work/dlc-current fetch -q --depth=1 origin "$DLC_SHA"
          git -C work/dlc-current checkout -q --detach FETCH_HEAD

          python3 scripts/prepare-geosite.py \
            --policy "$POLICY_FILE" \
            --dlc-data work/dlc-current/data \
            --ru-blocked work/inputs/current-ru-blocked.txt \
            --output-data work/data-current \
            --datprofile work/datprofile-current.json

          HASH_OUT="$(python3 scripts/hash-source-tree.py --dir work/data-current --exclude ru-blocked)"
          printf '%s\n' "$HASH_OUT"
          RELEVANT_HASH="$(printf '%s\n' "$HASH_OUT" | sed -n 's/^RELEVANT_HASH=//p')"

          python3 scripts/make-fingerprint.py \
            --provenance work/provenance-current-discovered.json \
            --relevant-hash "$RELEVANT_HASH" \
            --policy "$POLICY_FILE" \
            --fingerprint-schema v2 \
            --build-contract "$BUILD_CONTRACT" \
            --output work/provenance-current.json

          python3 scripts/classify-change.py \
            --baseline "$BASELINE_FILE" \
            --provenance work/provenance-current.json \
            --build-contract "$BUILD_CONTRACT" \
            --output work/change-reasons.json

          BASE_FP="$(python3 -c 'import json; print(json.load(open("work/provenance-baseline.json"))["inputFingerprint"])')"
          CUR_FP="$(python3 -c 'import json; print(json.load(open("work/provenance-current.json"))["inputFingerprint"])')"

          python3 scripts/release-state.py \
            --repo "$GITHUB_REPOSITORY" \
            --baseline "$BASELINE_FILE" \
            --build-contract "$BUILD_CONTRACT" \
            --baseline-fingerprint "$BASE_FP" \
            --current-fingerprint "$CUR_FP" \
            --output work/release-state.json

          python3 - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          prov = json.loads(Path("work/provenance-current.json").read_text())
          state = json.loads(Path("work/release-state.json").read_text())
          changes = json.loads(Path("work/change-reasons.json").read_text())

          timestamps = [
              prov["domainListCommunity"]["timestamp"],
              prov["ruBlockedGeosite"]["publishedAt"],
              prov["geoip"]["publishedAt"],
          ]
          newest = max(int(datetime.fromisoformat(x.replace("Z", "+00:00")).timestamp()) for x in timestamps)
          last_updated = max(int(state["nextLastUpdatedFloor"]), newest)

          meta = {
              "mode": "current",
              "noChanges": bool(state["noChanges"]),
              "staleDraftMatch": bool(state["staleDraftMatch"]),
              "matchingDraftTag": state["matchingDraftTag"],
              "scheduleAutoPublishEligible": bool(changes["scheduledAutoPublishEligible"]),
              "changeReasons": changes["changeReasons"],
              "tag": state["newTag"],
              "lastUpdated": last_updated,
              "previousProduction": state["previousProductionRelease"],
              "inputFingerprint": prov["inputFingerprint"],
          }
          Path("work/candidate-meta.json").write_text(json.dumps(meta, indent=2) + "\n")
          PY

          cp work/provenance-current.json work/candidate-provenance.json
          ln -s "$PWD/work/dlc-current" work/dlc-candidate
          ln -s "$PWD/work/data-current" work/data-candidate
          ln -s "$PWD/work/datprofile-current.json" work/datprofile-candidate.json
          ln -s "$PWD/work/inputs/current-geoip.dat" work/geoip-candidate.dat

      - name: Export candidate metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          m = json.load(open("work/candidate-meta.json"))
          print("no_changes=" + str(m["noChanges"]).lower())
          print("tag=" + m["tag"])
          print("input_fingerprint=" + m["inputFingerprint"])
          print("previous_production=" + m["previousProduction"])
          print("last_updated=" + str(m["lastUpdated"]))
          print("stale_draft=" + str(m.get("staleDraftMatch", False)).lower())
          print("schedule_eligible=" + str(m.get("scheduleAutoPublishEligible", False)).lower())
          print("change_reasons=" + ",".join(m.get("changeReasons", [])))
          PY

          cat work/candidate-meta.json

      - name: Write runtime provenance to job summary
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "### Runtime provenance (excluded from production bundle hashes)"
            echo ""
            echo "- workflowRunId: $GITHUB_RUN_ID"
            echo "- workflowRunURL: $RUN_URL"
            echo "- workflowTrigger: $GITHUB_EVENT_NAME"
            echo "- repositoryCommitSHA: $GITHUB_SHA"
            echo "- actor: $GITHUB_ACTOR"
            echo "- runTimestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- targetRelease: ${{ steps.meta.outputs.tag }}"
            echo "- previousProductionRelease: ${{ steps.meta.outputs.previous_production }}"
            echo "- inputFingerprint: ${{ steps.meta.outputs.input_fingerprint }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop recoverably on stale matching draft
        if: ${{ steps.meta.outputs.stale_draft == 'true' }}
        shell: bash
        run: |
          echo "RESULT=STALE_DRAFT_REVALIDATION_REQUIRED" >&2
          exit 1

      - name: Block scheduled publish for non-upstream-only changes
        if: ${{ needs.mode.outputs.run_mode == 'scheduled' && steps.meta.outputs.no_changes != 'true' && steps.meta.outputs.schedule_eligible != 'true' }}
        shell: bash
        run: |
          echo "RESULT=MANUAL_REVIEW_REQUIRED"
          echo "CHANGE_REASONS=${{ steps.meta.outputs.change_reasons }}"
          exit 1

      - name: Stop cleanly when inputs are unchanged
        if: ${{ steps.meta.outputs.no_changes == 'true' }}
        shell: bash
        run: |
          echo "RESULT=NO_CHANGES"

      - name: Build GeoSite and GeoIP
        if: ${{ steps.meta.outputs.no_changes != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/bundle work/geosite-out

          DLC_SHA="$(python3 -c 'import json; print(json.load(open("work/candidate-provenance.json"))["domainListCommunity"]["commit"])')"
          GEOIP_SHA="$(python3 -c 'import json; print(json.load(open("work/candidate-provenance.json"))["geoip"]["sha256"])')"

          scripts/build-geosite.sh \
            work/dlc-candidate \
            work/data-candidate \
            work/datprofile-candidate.json \
            work/geosite-out \
            "$DLC_SHA"

          cp work/geosite-out/UDAL-GEOSITE.dat work/bundle/UDAL-GEOSITE.dat

          scripts/build-geoip.sh \
            work/geoip-candidate.dat \
            work/bundle \
            "$GEOIP_SHA"

      - name: Install and verify pinned Xray
        if: ${{ steps.meta.outputs.no_changes != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          XRAY_VERSION="$(python3 -c 'import json; print(json.load(open("config/toolchain-lock.json"))["xray"]["version"])')"
          XRAY_ASSET="$(python3 -c 'import json; print(json.load(open("config/toolchain-lock.json"))["xray"]["linuxAmd64Asset"])')"
          XRAY_SHA="$(python3 -c 'import json; print(json.load(open("config/toolchain-lock.json"))["xray"]["linuxAmd64Sha256"])')"

          gh api "repos/XTLS/Xray-core/releases/tags/v$XRAY_VERSION" > work/xray-release.json
          XRAY_ID="$(python3 - "$XRAY_ASSET" <<'PY'
          import json, sys
          obj = json.load(open("work/xray-release.json"))
          hits = [a for a in obj["assets"] if a["name"] == sys.argv[1]]
          if len(hits) != 1:
              raise SystemExit("FAIL: pinned Xray asset not found")
          print(hits[0]["id"])
          PY
          )"

          gh api "repos/XTLS/Xray-core/releases/assets/$XRAY_ID" \
            -H "Accept: application/octet-stream" > work/xray.zip
          test "$(sha256sum work/xray.zip | awk '{print $1}')" = "$XRAY_SHA"

          mkdir -p work/xray
          unzip -q work/xray.zip -d work/xray
          chmod +x work/xray/xray
          work/xray/xray version | head -n 1

      - name: Validate geodata with Xray
        if: ${{ steps.meta.outputs.no_changes != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          POLICY_FOR_BUILD="$POLICY_FILE"
          if [[ "${{ needs.mode.outputs.baseline_reproduction }}" == "true" ]]; then
            POLICY_FOR_BUILD="$BASELINE_POLICY_FILE"
          fi

          scripts/validate-geodata.sh \
            work/dlc-candidate \
            work/bundle/UDAL-GEOSITE.dat \
            work/bundle/UDAL-GEOIP.dat \
            work/xray/xray \
            "$POLICY_FOR_BUILD" \
            config/validation-contract.json \
            work/geodata-validation

      - name: Build snapshot and live routing
        if: ${{ steps.meta.outputs.no_changes != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          POLICY_FOR_BUILD="$POLICY_FILE"
          if [[ "${{ needs.mode.outputs.baseline_reproduction }}" == "true" ]]; then
            POLICY_FOR_BUILD="$BASELINE_POLICY_FILE"
          fi

          python3 scripts/build-routing.py \
            --template work/baseline-release/UDAL-ROUTING.json \
            --policy "$POLICY_FOR_BUILD" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "${{ steps.meta.outputs.tag }}" \
            --url-mode snapshot \
            --last-updated "${{ steps.meta.outputs.last_updated }}" \
            --output work/bundle/UDAL-ROUTING.json

          if [[ "${{ needs.mode.outputs.baseline_reproduction }}" != "true" ]]; then
            python3 scripts/build-routing.py \
              --template work/baseline-release/UDAL-ROUTING.json \
              --policy "$POLICY_FOR_BUILD" \
              --repo "$GITHUB_REPOSITORY" \
              --tag "${{ steps.meta.outputs.tag }}" \
              --url-mode live \
              --last-updated "${{ steps.meta.outputs.last_updated }}" \
              --output work/bundle/UDAL-ROUTING-LIVE.json
          fi

      - name: Verify minimal routing semantic diff
        if: ${{ needs.mode.outputs.baseline_reproduction != 'true' && steps.meta.outputs.no_changes != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-routing-diff.py \
            --baseline work/baseline-release/UDAL-ROUTING.json \
            --candidate work/bundle/UDAL-ROUTING.json

      - name: Pre-manifest secret scan
        if: ${{ steps.meta.outputs.no_changes != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/scan-secrets.py --repo-root . --bundle work/bundle

      - name: Build deterministic MANIFEST v2 and SHA256SUMS
        if: ${{ needs.mode.outputs.baseline_reproduction != 'true' && steps.meta.outputs.no_changes != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/make-manifest.py \
            --manifest-config "$MANIFEST_CONFIG" \
            --build-contract config/build-contract.json \
            --toolchain-lock config/toolchain-lock.json \
            --validation-contract config/validation-contract.json \
            --policy "$POLICY_FILE" \
            --provenance work/candidate-provenance.json \
            --bundle work/bundle \
            --tag "${{ steps.meta.outputs.tag }}" \
            --previous-production "${{ steps.meta.outputs.previous_production }}" \
            --last-updated "${{ steps.meta.outputs.last_updated }}" \
            --input-fingerprint "${{ steps.meta.outputs.input_fingerprint }}" \
            --output work/bundle/MANIFEST.json

          python3 scripts/make-sha256sums.py --bundle work/bundle --build-contract config/build-contract.json

      - name: Verify deterministic MANIFEST v2 and SHA256SUMS
        if: ${{ needs.mode.outputs.baseline_reproduction != 'true' && steps.meta.outputs.no_changes != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/repeat-bundle
          cp work/bundle/UDAL-GEOSITE.dat work/repeat-bundle/
          cp work/bundle/UDAL-GEOIP.dat work/repeat-bundle/
          cp work/bundle/UDAL-ROUTING.json work/repeat-bundle/
          cp work/bundle/UDAL-ROUTING-LIVE.json work/repeat-bundle/

          python3 scripts/make-manifest.py \
            --manifest-config "$MANIFEST_CONFIG" \
            --build-contract config/build-contract.json \
            --toolchain-lock config/toolchain-lock.json \
            --validation-contract config/validation-contract.json \
            --policy "$POLICY_FILE" \
            --provenance work/candidate-provenance.json \
            --bundle work/repeat-bundle \
            --tag "${{ steps.meta.outputs.tag }}" \
            --previous-production "${{ steps.meta.outputs.previous_production }}" \
            --last-updated "${{ steps.meta.outputs.last_updated }}" \
            --input-fingerprint "${{ steps.meta.outputs.input_fingerprint }}" \
            --output work/repeat-bundle/MANIFEST.json

          python3 scripts/make-sha256sums.py --bundle work/repeat-bundle --build-contract config/build-contract.json

          cmp work/bundle/MANIFEST.json work/repeat-bundle/MANIFEST.json
          cmp work/bundle/SHA256SUMS work/repeat-bundle/SHA256SUMS
          echo "MANIFEST_V2_DETERMINISM=PASS"
          echo "SHA256SUMS_DETERMINISM=PASS"

      - name: Final validation and secret scan
        if: ${{ needs.mode.outputs.baseline_reproduction != 'true' && steps.meta.outputs.no_changes != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/scan-secrets.py --repo-root . --bundle work/bundle

          python3 scripts/validate-artifacts.py \
            --bundle work/bundle \
            --policy "$POLICY_FILE" \
            --contract config/validation-contract.json \
            --manifest-config "$MANIFEST_CONFIG" \
            --build-contract "$BUILD_CONTRACT" \
            --toolchain-lock config/toolchain-lock.json \
            --provenance work/candidate-provenance.json \
            --repo "$GITHUB_REPOSITORY" \
            --tag "${{ steps.meta.outputs.tag }}" \
            --previous-production "${{ steps.meta.outputs.previous_production }}" \
            --last-updated "${{ steps.meta.outputs.last_updated }}" \
            --input-fingerprint "${{ steps.meta.outputs.input_fingerprint }}"

      - name: Legacy 2026.09.25.3 core reproduction gate
        if: ${{ needs.mode.outputs.baseline_reproduction == 'true' && steps.meta.outputs.no_changes != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          baseline = json.loads(Path(os.environ["BASELINE_FILE"]).read_text())
          bundle = Path("work/bundle")
          names = ["UDAL-GEOSITE.dat", "UDAL-GEOIP.dat", "UDAL-ROUTING.json"]

          for name in names:
              md = baseline["artifacts"][name]
              path = bundle / name
              if not path.is_file():
                  raise SystemExit(f"FAIL: legacy baseline core output missing {name}")
              data = path.read_bytes()
              got_sha = hashlib.sha256(data).hexdigest()
              if got_sha != md["sha256"] or len(data) != md["size"]:
                  raise SystemExit(f"FAIL: legacy baseline core mismatch: {name}")
              print(f"{name}=PASS")

          print("LEGACY_MANIFEST_SCHEMA_V1=KNOWN_RUNTIME_METADATA_NONDETERMINISM")
          print("LEGACY_MANIFEST_SECOND_REPRODUCTION=NOT_REQUIRED")
          print("BASELINE_CORE_REPRODUCTION=PASS")
          PY

      - name: Upload validated build artifact
        if: ${{ needs.mode.outputs.baseline_reproduction != 'true' && steps.meta.outputs.no_changes != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: geo-candidate-${{ github.run_id }}
          path: |
            work/bundle
            work/candidate-provenance.json
            work/candidate-meta.json
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: [mode, build]
    if: ${{ needs.mode.outputs.manifest_test != 'true' && needs.mode.outputs.baseline_reproduction != 'true' && needs.mode.outputs.dry_run != 'true' && needs.build.outputs.no_changes == 'false' && needs.build.outputs.stale_draft != 'true' && (needs.mode.outputs.run_mode == 'manual' || needs.build.outputs.schedule_eligible == 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download validated candidate
        uses: actions/download-artifact@v4
        with:
          name: geo-candidate-${{ github.run_id }}
          path: work

      - name: Re-verify local candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(find work/bundle -maxdepth 1 -type f | wc -l | tr -d ' ')" = "6"
          (
            cd work/bundle
            sha256sum -c SHA256SUMS
          )

      - name: Create and verify draft release
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ needs.build.outputs.tag }}"
          FP="${{ needs.build.outputs.input_fingerprint }}"
          PREV="${{ needs.build.outputs.previous_production }}"
          LAST_UPDATED="${{ needs.build.outputs.last_updated }}"

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "FAIL: tag already exists: $TAG" >&2
            exit 1
          fi

          if gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | python3 -c 'import json,sys; tag=sys.argv[1]; sys.exit(0 if any(r.get("tag_name")==tag for r in json.load(sys.stdin)) else 1)' "$TAG"
          then
            echo "FAIL: release already exists: $TAG" >&2
            exit 1
          fi

          python3 - "$TAG" "$FP" "$PREV" "$LAST_UPDATED" <<'PY'
          import hashlib, json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path

          tag, fp, previous, last_updated = sys.argv[1:]
          prov = json.loads(Path("work/candidate-provenance.json").read_text())
          bundle = Path("work/bundle")

          lines = [
              "HAPP routing geo-update candidate",
              "",
              f"Previous production: {previous}",
              f"v2fly commit: {prov['domainListCommunity']['commit']}",
              f"v2fly relevant hash: {prov['domainListCommunity']['relevantHash']}",
              f"RunetFreedom geosite release: {prov['ruBlockedGeosite']['release']}",
              f"RunetFreedom ru-blocked SHA256: {prov['ruBlockedGeosite']['sha256']}",
              f"RunetFreedom GeoIP release: {prov['geoip']['release']}",
              f"RunetFreedom GeoIP SHA256: {prov['geoip']['sha256']}",
              "Validation: PASS",
              "",
              "Runtime provenance (excluded from production bundle hashes):",
              f"Workflow run ID: {os.environ['GITHUB_RUN_ID']}",
              f"Workflow run URL: https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              f"Workflow trigger: {os.environ['GITHUB_EVENT_NAME']}",
              f"Repository commit SHA: {os.environ['GITHUB_SHA']}",
              f"Actor: {os.environ['GITHUB_ACTOR']}",
              f"Run timestamp: {datetime.now(timezone.utc).isoformat()}",
              "",
              "SHA256:",
          ]
          for name in ["UDAL-GEOSITE.dat","UDAL-GEOIP.dat","UDAL-ROUTING.json","UDAL-ROUTING-LIVE.json","MANIFEST.json","SHA256SUMS"]:
              h = hashlib.sha256((bundle / name).read_bytes()).hexdigest()
              lines.append(f"{h}  {name}")
          lines.extend([
              "",
              f"INPUT_FINGERPRINT={fp}",
              f"ROUTING_LAST_UPDATED={last_updated}",
              "AUTO_PUBLISH_POLICY=SCHEDULE_UPSTREAM_ONLY",
          ])
          Path("work/release-notes.txt").write_text("\n".join(lines) + "\n")
          payload = {
              "tag_name": tag,
              "target_commitish": os.environ["GITHUB_SHA"],
              "name": tag,
              "body": Path("work/release-notes.txt").read_text(),
              "draft": True,
              "prerelease": False,
          }
          Path("work/create-release.json").write_text(json.dumps(payload))
          PY

          RELEASE_JSON="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" --input work/create-release.json)"
          RID="$(printf '%s' "$RELEASE_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"

          cleanup() {
            echo "Draft creation failed; removing draft created by this run." >&2
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$RID" >/dev/null 2>&1 || true
          }
          trap cleanup ERR

          gh release upload "$TAG" \
            work/bundle/UDAL-GEOSITE.dat \
            work/bundle/UDAL-GEOIP.dat \
            work/bundle/UDAL-ROUTING.json \
            work/bundle/UDAL-ROUTING-LIVE.json \
            work/bundle/MANIFEST.json \
            work/bundle/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY"

          gh api "repos/$GITHUB_REPOSITORY/releases/$RID" > work/remote-release.json

          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          r = json.loads(Path("work/remote-release.json").read_text())
          if r.get("draft") is not True or r.get("published_at") is not None:
              raise SystemExit("FAIL: release is not draft")
          assets = r.get("assets", [])
          expected = {"UDAL-GEOSITE.dat","UDAL-GEOIP.dat","UDAL-ROUTING.json","UDAL-ROUTING-LIVE.json","MANIFEST.json","SHA256SUMS"}
          if {a["name"] for a in assets} != expected or len(assets) != 6:
              raise SystemExit("FAIL: remote draft asset set")
          for a in assets:
              local = hashlib.sha256((Path("work/bundle") / a["name"]).read_bytes()).hexdigest()
              if a.get("digest") != "sha256:" + local:
                  raise SystemExit(f"FAIL: remote digest mismatch {a['name']}")
          print("REMOTE_DRAFT_DIGESTS=PASS")
          PY

          mkdir work/remote-download
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir work/remote-download

          python3 scripts/verify-draft-release.py \
            --release-json work/remote-release.json \
            --bundle work/bundle \
            --remote-dir work/remote-download \
            --build-contract config/build-contract.json

          printf '%s\n' "$RID" > work/release-id.txt
          trap - ERR
          echo "DRAFT_TAG=$TAG"
          echo "DRAFT_REMOTE_VALIDATION=PASS"

      - name: Publish exact validated draft on scheduled upstream-only change
        if: ${{ needs.mode.outputs.auto_publish == 'true' && needs.build.outputs.schedule_eligible == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/publish-validated-draft.sh \
            "$GITHUB_REPOSITORY" \
            "${{ needs.build.outputs.tag }}" \
            "$(cat work/release-id.txt)" \
            work/bundle \
            config/build-contract.json \
            work/post-publish
